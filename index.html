<!doctype html>
<html lang="he" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>ממצאי פיילוט</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='8' fill='%233554D1'/%3E%3Cpath d='M22 26V7H11l2.5 4.5L11 16h11' fill='none' stroke='white' stroke-width='2.6' stroke-linecap='round' stroke-linejoin='round'/%3E%3C/svg%3E">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="ממצאי פיילוט">
<meta name="theme-color" content="#3554D1">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Heebo:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#F6F7F9;--surface:#FFFFFF;--surface-2:#F3F4F7;--hover:#F5F6F9;--sel:#ECEFFA;--border:#E3E5EA;--border-strong:#CDD1D9;
  --text:#16181D;--text-2:#474C58;--text-3:#676C79;
  --accent:#3554D1;--accent-hover:#2B47B8;--accent-fg:#FFFFFF;--accent-soft:#EDF1FE;--accent-text:#2B47B8;
  --ok:#0E7A43;--ok-soft:#E3F5EA;--ok-bd:#B9E3C9;--warn:#8F5200;--warn-soft:#FDF1DC;--danger:#B42318;--danger-soft:#FDECEA;--danger-bd:#F6C9C4;
  --toast:#1F222A;--shadow:0 1px 2px rgba(16,24,40,.06),0 10px 28px rgba(16,24,40,.12);--shadow-sm:0 1px 2px rgba(16,24,40,.05),0 8px 24px rgba(16,24,40,.07);
  --st-open-bg:#E7EFFD;--st-open-fg:#1B4DB1;--st-open-dot:#2F6FE4;
  --st-progress-bg:#FDF1DC;--st-progress-fg:#874A00;--st-progress-dot:#E08A00;
  --st-feedback-bg:#F0EAFD;--st-feedback-fg:#5B2FC0;--st-feedback-dot:#8B5CF6;
  --st-resolved-bg:#E2F5EA;--st-resolved-fg:#0B6637;--st-resolved-dot:#16A35A;
  --st-closed-bg:#ECEEF2;--st-closed-fg:#3F4552;--st-closed-dot:#5F6675;
  --st-irrelevant-fg:#676C79;--st-irrelevant-dot:#A3A8B3;--st-irrelevant-bd:#D5D8DE;
  --sev-critical:#D92D20;--sev-critical-fg:#B42318;--sev-critical-bg:#FDECEA;
  --sev-high:#E8590C;--sev-high-fg:#B54708;--sev-high-soft:#FEF0E7;
  --sev-medium:#D29A00;--sev-medium-fg:#8A6100;--sev-low:#8A909B;--sev-low-fg:#5C616D;--bar-off:#DDE0E5;
  --sk:#ECEEF2;--sk-hi:#F6F7F9;
}
html.dark{
  --bg:#0E1014;--surface:#16181E;--surface-2:#1B1E25;--hover:#1E2129;--sel:#1F2536;--border:#272B34;--border-strong:#363B46;
  --text:#E8EAEE;--text-2:#B9BEC8;--text-3:#8E94A0;
  --accent:#4562EA;--accent-hover:#5571F0;--accent-fg:#FFFFFF;--accent-soft:rgba(98,128,250,.16);--accent-text:#A3B5FF;
  --ok:#5FD38F;--ok-soft:rgba(40,190,110,.14);--ok-bd:rgba(60,200,120,.35);--warn:#F2B866;--warn-soft:rgba(240,160,40,.14);--danger:#FF8F87;--danger-soft:rgba(240,70,60,.15);--danger-bd:rgba(240,90,80,.35);
  --toast:#2A2E38;--shadow:0 1px 2px rgba(0,0,0,.4),0 14px 36px rgba(0,0,0,.5);--shadow-sm:0 1px 2px rgba(0,0,0,.4),0 10px 30px rgba(0,0,0,.35);
  --st-open-bg:rgba(70,130,240,.17);--st-open-fg:#A3C4FF;--st-open-dot:#5B93F5;
  --st-progress-bg:rgba(240,160,40,.16);--st-progress-fg:#F5C57E;--st-progress-dot:#F0A43A;
  --st-feedback-bg:rgba(160,120,250,.17);--st-feedback-fg:#CDB9FF;--st-feedback-dot:#A788FA;
  --st-resolved-bg:rgba(40,190,110,.15);--st-resolved-fg:#93DFB4;--st-resolved-dot:#34C27A;
  --st-closed-bg:rgba(150,160,175,.15);--st-closed-fg:#C6CBD4;--st-closed-dot:#8D94A1;
  --st-irrelevant-fg:#8E94A0;--st-irrelevant-dot:#6B717D;--st-irrelevant-bd:#3A3F4A;
  --sev-critical:#F0605A;--sev-critical-fg:#FFA39C;--sev-critical-bg:rgba(240,70,60,.17);
  --sev-high:#F3833F;--sev-high-fg:#F8AC7C;--sev-high-soft:rgba(243,131,63,.15);
  --sev-medium:#E2B23A;--sev-medium-fg:#EDCB72;--sev-low:#7D8390;--sev-low-fg:#A6ACB7;--bar-off:#343944;
  --sk:#1F232B;--sk-hi:#272B35;color-scheme:dark;
}
*{box-sizing:border-box}
html,body{margin:0;background:var(--bg);color:var(--text)}
body{font-family:Heebo,Assistant,"Segoe UI",system-ui,sans-serif;font-size:14px;line-height:1.45;-webkit-font-smoothing:antialiased}
button,input,textarea,select{font-family:inherit;color:inherit}
a{color:var(--accent-text);text-decoration:none}
a:hover{color:var(--accent)}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.sr{position:absolute;width:1px;height:1px;margin:-1px;padding:0;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap;border:0}
.truncate{white-space:nowrap;overflow:hidden;text-overflow:ellipsis;min-width:0}
.muted{color:var(--text-3)}
.boot{padding:80px;text-align:center;color:var(--text-3)}
svg{flex:0 0 auto}

/* ---------- layout */
.shell{min-height:100vh;display:flex;align-items:stretch}
.side{width:248px;flex:0 0 248px;display:flex;flex-direction:column;gap:20px;padding:16px 12px;background:var(--surface);border-inline-end:1px solid var(--border);position:sticky;top:0;height:100vh;overflow-y:auto}
.brand{display:flex;align-items:center;gap:10px;padding:4px 6px}
.logo{width:32px;height:32px;border-radius:8px;background:var(--accent);color:#fff;display:flex;align-items:center;justify-content:center;flex:0 0 auto}
.brand-t{font-weight:700;font-size:15px}
.brand-s{font-size:12px;color:var(--text-3)}
.pilot-card{padding:12px;border-radius:10px;background:var(--surface-2);display:flex;flex-direction:column;gap:8px}
.progress{height:6px;border-radius:999px;background:var(--border);overflow:hidden}
.progress>div{height:100%;background:var(--accent);border-radius:999px}
.nav{display:flex;flex-direction:column;gap:2px}
.nav a{display:flex;align-items:center;gap:10px;height:36px;padding:0 10px;border-radius:8px;color:var(--text-2);font-size:13.5px;font-weight:500}
.nav a:hover{background:var(--hover);color:var(--text)}
.nav a.active{background:var(--sel);color:var(--text);font-weight:600}
.nav a svg{color:var(--text-3)}
.nav a.active svg{color:var(--accent-text)}
.count{font-size:11.5px;font-weight:600;color:var(--text-3);font-variant-numeric:tabular-nums;padding:1px 7px;border-radius:999px;background:var(--surface-2)}
.tagm{font-size:11px;font-weight:600;color:var(--text-3);border:1px solid var(--border);border-radius:5px;padding:0 5px}
.side-user{margin-top:auto;display:flex;align-items:center;gap:10px;padding:12px 6px 0;border-top:1px solid var(--border)}
.main{flex:1;min-width:0;display:flex;flex-direction:column;padding:0 24px 32px}
.page-h{display:flex;flex-wrap:wrap;align-items:center;gap:12px;padding:18px 0 10px}
.page-h h1{margin:0;font-size:20px;font-weight:700}
.page-h .sub{font-size:12.5px;color:var(--text-3)}
.grow{margin-inline-end:auto;display:flex;flex-direction:column;gap:2px}
.tabbar{display:none}
.mobile-top{display:none}

/* ---------- controls */
.btn{display:inline-flex;align-items:center;gap:6px;height:32px;padding:0 12px;border-radius:8px;border:1px solid var(--border);background:var(--surface);color:var(--text);font-size:13px;font-weight:500;cursor:pointer;white-space:nowrap;text-decoration:none}
.btn:hover{background:var(--hover);border-color:var(--border-strong);color:var(--text)}
.btn:disabled{opacity:.5;cursor:default}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--accent-fg);font-weight:600}
.btn.primary:hover{background:var(--accent-hover);border-color:var(--accent-hover);color:var(--accent-fg)}
.btn.danger{color:var(--danger);border-color:var(--danger-bd)}
.btn.danger:hover{background:var(--danger-soft)}
.btn.on{background:var(--accent-soft);border-color:transparent;color:var(--accent-text)}
.btn.icon{width:32px;padding:0;justify-content:center}
.btn.sm{height:28px;padding:0 10px;font-size:12.5px}
.btn.lg{height:44px;padding:0 18px;font-size:15px;border-radius:10px}
.badge{min-width:18px;height:18px;padding:0 5px;border-radius:999px;background:var(--accent);color:var(--accent-fg);font-size:11px;font-weight:700;display:inline-flex;align-items:center;justify-content:center}
.input,.select,.textarea{height:34px;border-radius:8px;border:1px solid var(--border);background:var(--surface);color:var(--text);font-size:13.5px;padding:0 10px;outline:none;width:100%}
.textarea{height:auto;min-height:90px;padding:8px 10px;resize:vertical;line-height:1.5}
.input::placeholder,.textarea::placeholder{color:var(--text-3)}
.input:focus,.select:focus,.textarea:focus{border-color:var(--accent);box-shadow:0 0 0 3px var(--accent-soft)}
.field{display:flex;flex-direction:column;gap:5px;min-width:0}
.field>label,.flabel{font-size:12.5px;font-weight:600;color:var(--text-2)}
.grid2{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}
.grid3{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:12px}
.switch{display:inline-flex;align-items:center;gap:8px;height:32px;padding:0 10px;border-radius:8px;border:1px solid var(--border);background:var(--surface);font-size:13px;font-weight:500;cursor:pointer}
.switch:hover{background:var(--hover)}
.track{position:relative;width:28px;height:16px;border-radius:999px;background:var(--border-strong);transition:background .15s}
.knob{position:absolute;top:2px;inset-inline-start:2px;width:12px;height:12px;border-radius:50%;background:#fff;box-shadow:0 1px 2px rgba(0,0,0,.25);transition:inset-inline-start .15s}
.switch.on{border-color:transparent;background:var(--accent-soft);color:var(--accent-text)}
.switch.on .track{background:var(--accent)}
.switch.on .knob{inset-inline-start:14px}
.card{background:var(--surface);border:1px solid var(--border);border-radius:12px;min-width:0}
.sec-t{margin:0;font-size:15px;font-weight:700}

/* ---------- tabs & filters */
.tabs{display:flex;gap:4px;border-bottom:1px solid var(--border);overflow-x:auto;scrollbar-width:none}
.tab{display:inline-flex;align-items:center;gap:6px;height:38px;padding:0 10px;border:0;border-bottom:2px solid transparent;margin-bottom:-1px;background:none;color:var(--text-2);font-size:13.5px;font-weight:500;cursor:pointer;white-space:nowrap}
.tab:hover{color:var(--text)}
.tab.active{color:var(--text);border-bottom-color:var(--accent);font-weight:600}
.toolbar{display:flex;flex-wrap:wrap;align-items:center;gap:8px;padding:12px 0 10px}
.search{position:relative;flex:0 1 280px;min-width:190px}
.search svg{position:absolute;inset-inline-start:10px;top:9px;color:var(--text-3)}
.search .input{padding-inline-start:32px}
.dd{position:relative}
.menu{position:absolute;inset-inline-start:0;top:calc(100% + 4px);z-index:30;min-width:220px;max-height:360px;overflow-y:auto;padding:4px;border-radius:10px;background:var(--surface);border:1px solid var(--border);box-shadow:var(--shadow);display:flex;flex-direction:column;gap:1px}
.menu.end{inset-inline-start:auto;inset-inline-end:0}
.menu.up{top:auto;bottom:calc(100% + 4px)}
.menu-h{padding:6px 8px 4px;font-size:11.5px;font-weight:600;color:var(--text-3)}
.menu-item{display:flex;align-items:center;gap:8px;width:100%;min-height:32px;padding:0 8px;border:0;border-radius:6px;background:none;color:var(--text);font-size:13px;text-align:start;cursor:pointer}
.menu-item:hover{background:var(--hover)}
.menu-meta{font-size:11.5px;color:var(--text-3)}
.chk{width:15px;height:15px;margin:0;accent-color:var(--accent);flex:0 0 auto}
.backdrop{position:fixed;inset:0;z-index:20;border:0;padding:0;background:transparent;cursor:default}
.chips{display:flex;flex-wrap:wrap;align-items:center;gap:6px;padding:0 0 12px}
.chip{display:inline-flex;align-items:center;gap:4px;height:26px;padding-inline:10px 3px;border-radius:7px;background:var(--surface);border:1px solid var(--border);font-size:12.5px}
.chip-x{width:20px;height:20px;border-radius:5px;border:0;background:none;color:var(--text-3);display:inline-flex;align-items:center;justify-content:center;cursor:pointer;padding:0}
.chip-x:hover{background:var(--hover);color:var(--text)}
.link-btn{border:0;background:none;padding:0 4px;height:26px;color:var(--accent-text);font-size:12.5px;font-weight:600;cursor:pointer}
.link-btn:hover{text-decoration:underline}

.stchips{display:flex;gap:6px;overflow-x:auto;padding:0 0 12px;scrollbar-width:none;-webkit-overflow-scrolling:touch}
.stchips::-webkit-scrollbar{display:none}
.stchip{flex:0 0 auto;height:34px;padding:0 12px;border-radius:999px;border:1px solid var(--border);background:var(--surface);color:var(--text-2);font-size:13px;font-weight:500;display:inline-flex;align-items:center;gap:6px;cursor:pointer;white-space:nowrap}
.stchip:hover{border-color:var(--border-strong);color:var(--text)}
.stchip.on{background:var(--text);border-color:var(--text);color:var(--bg);font-weight:600}
.stchip .n{font-size:11.5px;opacity:.75;font-variant-numeric:tabular-nums}
.stchip .dot{width:7px;height:7px}

.stwrap{position:relative}
.stwrap::before,.stwrap::after{content:'';position:absolute;top:0;bottom:12px;width:56px;pointer-events:none;opacity:0;transition:opacity .15s;z-index:1}
.stwrap::after{left:0;background:linear-gradient(to right,var(--bg) 35%,transparent)}
.stwrap::before{right:0;background:linear-gradient(to left,var(--bg) 20%,transparent)}
.stwrap.more-end::after,.stwrap.more-start::before{opacity:1}
.st-more{position:absolute;left:0;top:1px;width:32px;height:32px;border-radius:50%;border:1px solid var(--border-strong);background:var(--surface);color:var(--text);box-shadow:0 2px 8px rgba(16,24,40,.15);display:none;align-items:center;justify-content:center;cursor:pointer;z-index:2;padding:0}
.stwrap.more-end .st-more{display:flex}

/* ---------- table */
.table{border:1px solid var(--border);border-radius:12px;background:var(--surface);overflow-x:auto}
.thead,.trow{display:flex;align-items:center;padding-inline:12px}
.thead{height:36px;background:var(--surface-2);border-radius:12px 12px 0 0}
.trow{min-height:44px;border-top:1px solid var(--border);transition:background .1s;cursor:pointer}
.trow:hover{background:var(--hover)}
.trow.dim .rt{color:var(--text-3)}
.th{display:inline-flex;align-items:center;gap:4px;border:0;background:none;padding:0;height:28px;font-size:12px;font-weight:600;color:var(--text-3);cursor:pointer;white-space:nowrap}
.th:hover,.th.active{color:var(--text)}
.th .ind{font-size:11px;color:var(--accent-text)}
.c-id{font-size:12.5px;color:var(--text-3);font-variant-numeric:tabular-nums}
.meta{display:inline-flex;align-items:center;gap:3px}
.cell-btn{display:flex;align-items:center;gap:7px;max-width:100%;height:28px;padding:0 6px;margin-inline-start:-6px;border-radius:6px;border:0;background:none;color:var(--text);font-size:13px;cursor:pointer;min-width:0}
.cell-btn:hover{background:var(--surface-2)}
.cell-btn .chev{opacity:0;color:var(--text-3)}
.trow:hover .cell-btn .chev{opacity:1}

.row-del{border-color:transparent;background:none;color:var(--text-3);opacity:.55}
.trow:hover .row-del{opacity:1}
.row-del:hover{color:var(--danger);background:var(--danger-soft);border-color:transparent}
.card-del{border-color:transparent;background:none;color:var(--text-3);width:36px;height:36px}
.card-del:hover{color:var(--danger);background:var(--danger-soft)}

/* ---------- pills */
.pill{display:inline-flex;align-items:center;gap:6px;height:24px;padding:0 9px;border-radius:999px;border:1px solid transparent;font-size:12.5px;font-weight:500;white-space:nowrap}
button.pill{cursor:pointer}
.pill .chev{opacity:.5}
.pill:hover .chev{opacity:1}
.st-open{background:var(--st-open-bg);color:var(--st-open-fg)}
.st-progress{background:var(--st-progress-bg);color:var(--st-progress-fg)}
.st-feedback{background:var(--st-feedback-bg);color:var(--st-feedback-fg)}
.st-resolved{background:var(--st-resolved-bg);color:var(--st-resolved-fg)}
.st-closed{background:var(--st-closed-bg);color:var(--st-closed-fg)}
.st-irrelevant{background:transparent;color:var(--st-irrelevant-fg);border-color:var(--st-irrelevant-bd)}
.dot{width:8px;height:8px;border-radius:50%;flex:0 0 auto;display:inline-block}
.d-open{background:var(--st-open-dot)}
.d-progress{background:var(--st-progress-dot)}
.d-feedback{background:var(--st-feedback-dot)}
.d-resolved{background:var(--st-resolved-dot)}
.d-closed{background:var(--st-closed-dot)}
.d-irrelevant{background:transparent;box-shadow:inset 0 0 0 1.5px var(--st-irrelevant-dot)}
.d-critical{background:var(--sev-critical)}
.d-high{background:var(--sev-high)}
.d-medium{background:var(--sev-medium)}
.d-low{background:var(--sev-low)}
.sev{display:inline-flex;align-items:center;gap:6px;font-size:12.5px;font-weight:500;white-space:nowrap}
.sev rect{fill:var(--bar-off)}
.sev-low{color:var(--sev-low-fg)}
.sev-low .b1{fill:var(--sev-low)}
.sev-medium{color:var(--sev-medium-fg)}
.sev-medium .b1,.sev-medium .b2{fill:var(--sev-medium)}
.sev-high{color:var(--sev-high-fg)}
.sev-high rect{fill:var(--sev-high)}
.sev-crit{display:inline-flex;align-items:center;gap:5px;height:22px;padding:0 8px;border-radius:6px;background:var(--sev-critical-bg);color:var(--sev-critical-fg);font-size:12px;font-weight:700;white-space:nowrap}
.av{width:22px;height:22px;border-radius:50%;display:inline-flex;align-items:center;justify-content:center;flex:0 0 auto;color:#fff;font-size:9.5px;font-weight:700;letter-spacing:-.02em}
.av-sm{width:20px;height:20px;font-size:9px}
.av-lg{width:30px;height:30px;font-size:11px}
.av-empty{background:transparent;border:1.5px dashed var(--border-strong)}
.due{font-size:12.5px;color:var(--text-2);display:inline-flex;align-items:center;gap:4px;font-variant-numeric:tabular-nums;white-space:nowrap}
.due.over{color:var(--danger);font-weight:600}
.due.today{color:var(--warn);font-weight:600}

/* ---------- sync indicator */
.sync{display:inline-flex;align-items:center;gap:6px;font-size:12px;color:var(--text-3);white-space:nowrap;border:0;background:none;padding:0;cursor:default}
.sync.err{color:var(--danger);font-weight:600;height:28px;padding:0 10px;border-radius:999px;border:1px solid var(--danger-bd);background:var(--danger-soft);cursor:pointer}

/* ---------- quick add */
.qa{width:100%;max-width:760px;margin:0 auto;padding:28px 0 48px;display:flex;flex-direction:column;gap:20px}
.qa h1{margin:0;font-size:28px;font-weight:700;line-height:1.25}
.qa-form{background:var(--surface);border:1px solid var(--border);border-radius:16px;box-shadow:var(--shadow-sm);padding:24px;display:flex;flex-direction:column;gap:22px}
.lab{font-size:14px;font-weight:600}
.lab small{font-weight:400;color:var(--text-3);font-size:13px}
.ta{width:100%;min-height:140px;resize:vertical;border:1.5px solid var(--border-strong);border-radius:12px;background:var(--surface);color:var(--text);font-size:17px;line-height:1.55;padding:14px 16px;outline:none}
.ta::placeholder{color:var(--text-3)}
.ta:focus{border-color:var(--accent);box-shadow:0 0 0 4px var(--accent-soft)}
.mchip{height:40px;padding:0 16px;border-radius:999px;border:1.5px solid var(--border);background:var(--surface);font-size:14.5px;font-weight:500;cursor:pointer;display:inline-flex;align-items:center;gap:6px}
.mchip:hover{border-color:var(--border-strong);background:var(--hover)}
.mchip.on{border-color:var(--accent);background:var(--accent-soft);color:var(--accent-text);font-weight:600}
.seg{flex:1 1 0;min-height:48px;border:1.5px solid var(--border);background:var(--surface);border-radius:10px;font-size:14px;font-weight:500;cursor:pointer;display:flex;align-items:center;justify-content:center;gap:8px;padding:0 10px;min-width:90px}
.seg:hover{background:var(--hover)}
.seg.on.low{border-color:var(--text-3);background:var(--surface-2);font-weight:600}
.seg.on.medium{border-color:var(--accent);background:var(--accent-soft);color:var(--accent-text);font-weight:600}
.seg.on.high{border-color:var(--sev-high);background:var(--sev-high-soft);color:var(--sev-high-fg);font-weight:600}
.seg.on.critical{border-color:var(--sev-critical);background:var(--sev-critical-bg);color:var(--sev-critical-fg);font-weight:700}

      (canDelete ? '<button class="btn icon danger" data-a="delFinding" data-id="' + f.id + '" aria-label="מחיקת הממצא" title="מחיקה">' + I.trash() + '</button>' : '') +

  // ------------------------------------------------------------------ page: summary
  function summaryData(k) {
    var opened = [], resolved = [], openEnd = [], feedback = [], crit = [], overdue = [];
    S.findings.forEach(function (f) {
      var st = statusAt(f, k);
      if (st == null) return;
      if (dayKey(f.createdAt) === k) opened.push(f);
      var resolvedThatDay = (f.history || []).some(function (h) { return h.field === 'status' && (h.to === 'resolved' || h.to === 'closed') && dayKey(h.at) === k; });
      if (resolvedThatDay && DONE.indexOf(st) >= 0) resolved.push(f);
      if (OPEN.indexOf(st) >= 0) {
        openEnd.push(f);
        if (st === 'feedback') feedback.push(f);
        if (f.severity === 'critical') crit.push(f);
        if (f.dueDate && f.dueDate < k) overdue.push(f);
      }
    });
    return { opened: opened, resolved: resolved, openEnd: openEnd, feedback: feedback, crit: crit, overdue: overdue };
  }
  function trendDays() {
    var t = today();
    var first = S.settings.pilotStart || (S.findings.length ? S.findings.reduce(function (m, f) { var d = dayKey(f.createdAt); return d < m ? d : m; }, t) : t);
    if (first > t) first = t;
    var days = [];
    for (var d = first; d <= t && days.length < 400; d = addDays(d, 1)) days.push(d);
    return days.slice(-45);
  }
  function viewSummary() {
    var k = S.summary.date, t = today();
    var D = summaryData(k);
    var days = trendDays();
    var series = days.map(function (d) { var x = summaryData(d); return { d: d, opened: x.opened.length, resolved: x.resolved.length, open: x.openEnd.length }; });
    var kpi = function (n, l, cls, sub) { return '<div class="card kpi' + (cls ? ' ' + cls : '') + '"><span class="n">' + n + '</span><span class="l">' + l + '</span>' + (sub ? '<span class="muted" style="font-size:12px">' + sub + '</span>' : '') + '</div>'; };
    var firstDay = days[0] || t;
    // chart
    var max = Math.max(4, Math.max.apply(null, series.map(function (s) { return Math.max(s.open, s.opened, s.resolved); })));
    var step = Math.ceil(max / 4); max = step * 4;
    var Wd = 736, Hd = 200, n = series.length;
    var PADX = 22; var xAt = function (i) { return n <= 1 ? Wd / 2 : Wd - PADX - (i / (n - 1)) * (Wd - 2 * PADX); }; // RTL: time flows right → left
    var yAt = function (v) { return Hd - (v / max) * Hd; };
    var bw = Math.max(3, Math.min(14, (Wd / Math.max(1, n)) / 3));
    var grid = '';

  // ------------------------------------------------------------------ files
  function readFile(file) {
    return new Promise(function (resolve, reject) {

      var r = new FileReader();
      r.onload = function () { resolve({ name: file.name || ('screenshot-' + Date.now() + '.png'), type: file.type || 'application/octet-stream', data: r.result }); };
      r.onerror = function () { reject(new Error('קריאת הקובץ נכשלה')); };
      r.readAsDataURL(file);
    });
  }
  function addFiles(files, target, id) {
    var arr = Array.prototype.slice.call(files || []);
    if (!arr.length) return;
    Promise.all(arr.map(readFile)).then(function (list) {
      if (target === 'qa') { S.qa.files = S.qa.files.concat(list); render(); return; }
      var p = Promise.resolve();
      list.forEach(function (f) { p = p.then(function () { return api('POST', '/api/findings/' + id + '/attachments', f).then(function (j) { upsert(j.finding, j.version); }); }); });
      return p.then(function () { render(); toast(list.length > 1 ? list.length + ' קבצים צורפו' : 'הקובץ צורף'); });
    }).catch(function (e) { toast(e.message, null, true); });

    },
    clearAll: function () { S.list.f = emptyF(); S.list.mine = false; S.list.q = ''; S.list.view = 'all'; S.list.dirty = false; S.menu = null; render(); },
    toggleMine: function () { S.list.mine = !S.list.mine; S.list.dirty = true; render(); },
    sort: function (el) { var k = el.getAttribute('data-v'); if (S.list.sortKey === k) S.list.sortDir = S.list.sortDir === 'asc' ? 'desc' : 'asc'; else { S.list.sortKey = k; S.list.sortDir = k === 'title' || k === 'module' || k === 'assignee' || k === 'owner' || k === 'reporter' || k === 'due' || k === 'severity' || k === 'status' ? 'asc' : 'desc'; } render(); },
    setStatus: function (el) { var id = Number(el.getAttribute('data-id')), v = el.getAttribute('data-v'); var f = byId(id); if (f && f.status === v) { S.menu = null; render(); return; } patchFinding(id, { status: v }, '#' + id + ' עבר ל״' + lbl(ST, v) + '״', true); },
    setAssignee: function (el) { var id = Number(el.getAttribute('data-id')), v = el.getAttribute('data-v'); patchFinding(id, { assigneeId: v ? Number(v) : null }, '#' + id + (v ? ' הועבר ל' + uname(v) : ' הוסר מהמטפל'), true); },
    qaModule: function (el) { var v = el.getAttribute('data-v'); S.qa.module = S.qa.module === v ? null : v; S.qa.last = null; render(); },
    qaSev: function (el) { S.qa.severity = el.getAttribute('data-v'); render(); },
    qaRemoveFile: function (el) { S.qa.files.splice(Number(el.getAttribute('data-i')), 1); render(); },
    qaUndo: function () {
      var id = S.qa.last && S.qa.last.id;
      if (!id) return;
      api('DELETE', '/api/findings/' + id).then(function (j) { S.findings = S.findings.filter(function (f) { return f.id !== id; }); S.version = j.version; S.qa.last = null; render(); toast('הממצא בוטל'); }).catch(function (e) { toast(e.message, null, true); });
    },
    pickFile: function (el) { var target = el.getAttribute('data-target'), id = el.getAttribute('data-id'); pickFiles(function (files) { addFiles(files, target, id); }); },
    delAtt: function (el) { if (!confirm('למחוק את הצרופה?')) return; api('DELETE', '/api/findings/' + el.getAttribute('data-id') + '/attachments/' + el.getAttribute('data-v')).then(function (j) { upsert(j.finding, j.version); render(); }).catch(function (e) { toast(e.message, null, true); }); },
    addComment: function (el) {
      var id = el.getAttribute('data-id'), ta = $('#d-comment');
      var text = ta ? ta.value.trim() : '';
      if (!text) return;
      api('POST', '/api/findings/' + id + '/comments', { text: text }).then(function (j) { upsert(j.finding, j.version); ta.value = ''; render(); }).catch(function (e) { toast(e.message, null, true); });
    },
    delFinding: function (el) {
      var id = Number(el.getAttribute('data-id'));
      S.menu = null; S.modal = { type: 'confirmDelete', id: id }; render();
      var b = $('#confirm-del'); if (b) b.focus();
    },
    confirmDelete: function () {
      var id = S.modal && S.modal.id; if (!id) return;
      var gone = byId(id);
      S.modal = null;
      // remove from the screen right away, restore if the server refuses
      S.findings = S.findings.filter(function (f) { return f.id !== id; }); if (S.drawer === id) S.drawer = null; render();
      api('DELETE', '/api/findings/' + id).then(function (j) { S.version = j.version; toast('ממצא #' + id + ' נמחק'); }).catch(function (e) { if (gone) upsert(gone); render(); toast('המחיקה לא בוצעה: ' + e.message, null, true); });
    },
    copyLink: function (el) { copyText((INIT.appUrl || '') + '?f=' + el.getAttribute('data-id')); },
    copyText: function (el) { copyText(el.getAttribute('data-v')); },
    day: function (el) { var v = Number(el.getAttribute('data-v')); S.summary.date = v === 0 ? today() : addDays(S.summary.date, v); if (S.summary.date > today()) S.summary.date = today(); render(); },
    pickDay: function (el) { S.summary.date = el.getAttribute('data-v'); render(); },
    copySummary: function () { S.modal = { type: 'copy', text: summaryText(S.summary.date) }; render(); var ta = $('#copy-area'); if (ta) { ta.focus(); ta.select(); } },
    doCopy: function () { copyText(S.modal.text); },
    mineMode: function (el) { S.mine.mode = el.getAttribute('data-v'); render(); },
    invite: function (el) {
      var id = el.getAttribute('data-id');
      api('POST', '/api/admin/users/' + id + '/invite').then(function (j) { S.lastInvite = { name: uname(id), token: j.invite }; render(); window.scrollTo(0, 0); }).catch(function (e) { toast(e.message, null, true); });
    },
    setPass: function (el) { S.modal = { type: 'pass', userId: Number(el.getAttribute('data-id')) }; render(); var i = $('#sp-pass'); if (i) i.focus(); },
    toggleActive: function (el) {
      var u = user(el.getAttribute('data-id'));
      if (u.active && !confirm('להשבית את ' + u.name + '? הוא/היא יתנתק/ו ולא יוכלו להיכנס. הממצאים שלהם נשמרים.')) return;
      adminUser(u.id, { active: !u.active }, u.active ? 'המשתמש הושבת' : 'המשתמש הופעל');
    },
    removeModule: function (el) { var i = Number(el.getAttribute('data-i')); S.modules.splice(i, 1); saveModules(S.modules); },
    regenSecret: function () { if (!confirm('ליצור קוד סודי חדש? צריך לעדכן אותו גם בסקריפט שבגיליון.')) return; api('PUT', '/api/admin/settings', { regenerateSecret: true }).then(reload).then(function () { toast('נוצר קוד חדש'); }).catch(function (e) { toast(e.message, null, true); }); },
    syncNow: function (el) {
      el.disabled = true; el.innerHTML = I.refresh() + 'מסנכרן…';
      api('POST', '/api/admin/sync').then(function (j) { S.sync = j.sync; render(); toast('סונכרנו ' + j.rows + ' שורות לגיליון'); }).catch(function (e) { reload().then(function () { toast(e.message, null, true); }); });
    }
  };

  function adminUser(id, patch, msg) {
    return api('PATCH', '/api/admin/users/' + id, patch).then(function (j) {
      var i = S.users.findIndex(function (u) { return u.id === j.user.id; }); if (i >= 0) S.users[i] = j.user;
      if (S.me.id === j.user.id) S.me = j.user;
      render(); if (msg) toast(msg);
    }).catch(function (e) { toast(e.message, null, true); render(); });
  }
  function saveModules(mods) {
    return api('PUT', '/api/admin/settings', { modules: mods }).then(reload).then(function () { toast('המודולים נשמרו'); }).catch(function (e) { toast(e.message, null, true); });
  }
  function reload() { return bootstrap().then(render); }

  function enterAs(name) {
    name = String(name || '').replace(/\s+/g, ' ').trim();
    if (name.length < 2) { S.authErr = 'כתבו את השם שלכם'; render(); return; }
    setName(name); S.authErr = null; S.status = null;
    S.route = 'add'; location.hash = '#/add';
    openAppNow();
  }

  // forms
  var FORMS = {
    qa: function () { qaSubmit(); },
    login: function (fd) { enterAs(fd.name); },
    setup: function (fd) {
      S.authErr = null;
      api('POST', '/api/setup', fd).then(bootFrom).then(function () { S.route = 'settings'; location.hash = '#/settings'; render(); toast('המערכת הוקמה. עכשיו מוסיפים את הצוות'); }).catch(function (e) { S.authErr = e.message; render(); });
    },
    invite: function (fd) {
      S.authErr = null;
      if (fd.password !== fd.password2) { S.authErr = 'הסיסמאות לא זהות'; render(); return; }
      api('POST', '/api/invite/' + encodeURIComponent(S.inviteToken), { name: fd.name, role: fd.role, password: fd.password }).then(bootFrom).then(function () { S.route = 'add'; location.hash = '#/add'; render(); }).catch(function (e) { S.authErr = e.message; render(); });
    },
    me: function (fd) {
      var body = { name: fd.name, role: fd.role };
      if (fd.newPassword) { body.newPassword = fd.newPassword; body.oldPassword = fd.oldPassword; }
      api('PATCH', '/api/me', body).then(function (j) { setName(j.me.name); S.me = j.me; var i = S.users.findIndex(function (u) { return u.id === j.me.id; }); if (i >= 0) S.users[i] = j.me; render(); toast('נשמר'); }).catch(function (e) { toast(e.message, null, true); });
    },
    project: function (fd) {
      api('PUT', '/api/admin/settings', { projectName: fd.projectName, clientName: fd.clientName, pilotStart: fd.pilotStart, goLive: fd.goLive, defaultOwnerId: fd.defaultOwnerId || null }).then(reload).then(function () { toast('נשמר'); }).catch(function (e) { toast(e.message, null, true); });
    },
    addUser: function (fd, form) {
      api('POST', '/api/admin/users', { name: fd.name, role: fd.role, isAdmin: !!fd.isAdmin }).then(function (j) {
        S.users.push(j.user); S.lastInvite = null; S.lastCreds = { name: j.user.name };
        render(); window.scrollTo(0, 0); toast('המשתמש נוסף');
      }).catch(function (e) { toast(e.message, null, true); });
    },
    modules: function (fd) {
      var mods = S.modules.map(function (m, i) { return { name: fd['m-name-' + i], defaultAssigneeId: fd['m-as-' + i] || null }; });
      if (fd['m-name-new'] && fd['m-name-new'].trim()) mods.push({ name: fd['m-name-new'].trim(), defaultAssigneeId: fd['m-as-new'] || null });
      saveModules(mods);
    },
    sheets: function (fd) {
      api('PUT', '/api/admin/settings', { sheetsUrl: fd.sheetsUrl }).then(reload).then(function () { toast(fd.sheetsUrl ? 'נשמר. הסנכרון הראשון ירוץ בעוד רגע' : 'הסנכרון ל-Sheets כובה'); setTimeout(function () { refreshVersion(true); }, 6000); }).catch(function (e) { toast(e.message, null, true); });
    },
    setPass: function (fd) {
      var id = S.modal.userId;
      adminUser(id, { password: fd.password }, 'הסיסמה עודכנה').then(function () { S.modal = null; render(); });
    }
  };

  // ------------------------------------------------------------------ events
  document.addEventListener('click', function (ev) {
    var el = ev.target.closest('[data-a]');
    if (!el) return;
    var a = el.getAttribute('data-a');
    if (a === 'closeModal' && el.classList.contains('modal-bg') && ev.target !== el) return; // click inside modal
    if (a === 'closeDrawer' && el.classList.contains('drawer-bg') && ev.target !== el) return;
    if (el.tagName === 'A' && a === 'view') ev.preventDefault();
    if (A[a]) { if (el.closest('form') && el.tagName === 'BUTTON' && el.getAttribute('type') !== 'button') ev.preventDefault(); A[a](el, ev); }
  });
  document.addEventListener('submit', function (ev) {
    var form = ev.target.closest('[data-form]');
    if (!form) return;
    ev.preventDefault();
    var fd = {};
    Array.prototype.forEach.call(form.elements, function (e) {
      if (!e.name) return;
      if (e.type === 'checkbox') fd[e.name] = e.checked; else fd[e.name] = e.value;
    });
    var fn = FORMS[form.getAttribute('data-form')];
    if (fn) fn(fd, form);
  });
  document.addEventListener('input', function (ev) {
    var el = ev.target;
    var k = el.getAttribute && el.getAttribute('data-i');
    if (k === 'q') {
      S.list.q = el.value;
      var box = $('#list-results'); if (box) box.innerHTML = listResults();
    } else if (k === 'qaText') {
      S.qa.text = el.value; lsSet('pt_draft', el.value);
      if (S.qa.last) { S.qa.last = null; var s = $('.success'); if (s) s.remove(); }
      var b = $('#qa-add'); if (b) b.disabled = !S.qa.text.trim() || S.qa.busy;
      var h = $('#qa-hint'); if (h) h.textContent = qaHint();
    } else if (el.getAttribute && el.getAttribute('data-c') === 'qa' && el.tagName !== 'SELECT') {
      S.qa[el.getAttribute('data-k')] = el.value;
    }
  });
  document.addEventListener('change', function (ev) {
    var el = ev.target;
    var c = el.getAttribute && el.getAttribute('data-c');
    if (!c) return;
    var k = el.getAttribute('data-k');
    if (c === 'flt') {
      var F = FILTERS.find(function (x) { return x.k === k; });
      var v = el.getAttribute('data-v');
      if (F.single) { S.list.f[k] = el.checked ? v : null; S.menu = null; }
      else { var arr = S.list.f[k].slice(); var i = arr.indexOf(v); if (el.checked && i < 0) arr.push(v); if (!el.checked && i >= 0) arr.splice(i, 1); S.list.f[k] = arr; }
      S.list.dirty = true; render();
    } else if (c === 'col') {
      S.list.cols[k] = el.checked; lsSet('pt_cols', S.list.cols); render();
    } else if (c === 'qa') {
      S.qa[k] = el.value; if (k === 'assigneeId') render();
    } else if (c === 'fld') {
      var f = byId(S.drawer); if (!f) return;
      var val = el.value;
      if (k === 'assigneeId' || k === 'ownerId') val = val ? Number(val) : null;
      if (k === 'dueDate') val = val || null;
      if (k === 'title' && !val.trim()) { el.value = f.title; return; }
      if ((f[k] == null ? '' : f[k]) === (val == null ? '' : val)) return;
      var msg = k === 'status' ? '#' + f.id + ' עבר ל״' + lbl(ST, val) + '״' : 'נשמר';
      patchFinding(f.id, (function () { var o = {}; o[k] = val; return o; })(), msg, k === 'status' || k === 'assigneeId');
    } else if (c === 'sumDate') {
      if (el.value) { S.summary.date = el.value > today() ? today() : el.value; render(); }
    } else if (c === 'userEdit') {
      var id = Number(el.getAttribute('data-id'));
      var patch = {}; patch[k] = el.type === 'checkbox' ? el.checked : el.value;
      adminUser(id, patch, 'נשמר');
    }
  });
  document.addEventListener('toggle', function (ev) {
    if (ev.target.matches && ev.target.matches('[data-a-toggle="qaMore"]')) S.qa.moreOpen = ev.target.open;
  }, true);
  document.addEventListener('keydown', function (ev) {
    if (ev.key === 'Escape') {
      if (S.menu) { S.menu = null; render(); return; }
      if (S.modal) { S.modal = null; render(); return; }
      if (S.drawer) { A.closeDrawer(); return; }
    }
    if ((ev.ctrlKey || ev.metaKey) && ev.key === 'Enter') {
      if (ev.target.id === 'qa-text' || (ev.target.closest && ev.target.closest('[data-form="qa"]'))) { ev.preventDefault(); qaSubmit(); }
      else if (ev.target.id === 'd-comment') { ev.preventDefault(); var b = $('[data-a="addComment"]'); if (b) A.addComment(b); }
    }
  });
  document.addEventListener('paste', function (ev) {
    if (S.phase !== 'app') return;
    var items = (ev.clipboardData && ev.clipboardData.files) || [];
    if (!items.length) return;
    if (S.drawer) { ev.preventDefault(); addFiles(items, 'drawer', S.drawer); }
    else if (S.route === 'add') { ev.preventDefault(); addFiles(items, 'qa'); }
  });
  // chart tooltip
  document.addEventListener('mouseover', function (ev) {
    var t = ev.target.closest && ev.target.closest('[data-tip]');
    var tip = $('#chart-tip');
    if (!tip) return;
    if (!t) { tip.style.display = 'none'; return; }
    var box = $('#chart').getBoundingClientRect(), r = t.getBoundingClientRect();
    tip.textContent = t.getAttribute('data-tip');
    tip.style.display = 'block';
    tip.style.right = 'auto';
    tip.style.left = Math.max(0, Math.min(box.width - 10, r.left - box.left + r.width / 2)) - tip.offsetWidth / 2 + 'px';
    tip.style.transform = 'translateY(-4px)';
    tip.style.top = '0px';
  });
  // kanban drag & drop
  var dragId = null;
  document.addEventListener('dragstart', function (ev) { var c = ev.target.closest && ev.target.closest('[data-drag]'); if (!c) return; dragId = Number(c.getAttribute('data-drag')); c.classList.add('dragging'); try { ev.dataTransfer.setData('text/plain', String(dragId)); ev.dataTransfer.effectAllowed = 'move'; } catch (e) { /* */ } });
  document.addEventListener('dragend', function (ev) { $$('.dragging').forEach(function (e) { e.classList.remove('dragging'); }); $$('.kcol.drop').forEach(function (e) { e.classList.remove('drop'); }); });
  document.addEventListener('dragover', function (ev) { var col = ev.target.closest && ev.target.closest('[data-drop]'); if (!col || dragId == null) return; ev.preventDefault(); $$('.kcol.drop').forEach(function (e) { if (e !== col) e.classList.remove('drop'); }); col.classList.add('drop'); });
  document.addEventListener('drop', function (ev) {
    var col = ev.target.closest && ev.target.closest('[data-drop]'); if (!col || dragId == null) return;
    ev.preventDefault();
    var st = col.getAttribute('data-drop'); var f = byId(dragId); var id = dragId; dragId = null;
    if (f && f.status !== st) patchFinding(id, { status: st }, '#' + id + ' עבר ל״' + lbl(ST, st) + '״', true);
  });

  function closeRowMenuOnScroll() { if (/^(st|as)-/.test(S.menu || '') && Date.now() - (S.menuAt || 0) > 300) { S.menu = null; render(); } }
  window.addEventListener('scroll', closeRowMenuOnScroll, { passive: true });
  window.addEventListener('resize', closeRowMenuOnScroll);
  document.addEventListener('scroll', function (ev) { if (ev.target && ev.target.classList && ev.target.classList.contains('table')) closeRowMenuOnScroll(); if (ev.target && ev.target.classList && ev.target.classList.contains('stchips')) updateStFade(); }, true);
  window.addEventListener('resize', updateStFade);

  // ------------------------------------------------------------------ live refresh
  var refreshing = false;
  function refreshVersion(force) {
    if (S.phase !== 'app' || refreshing) return;
    refreshing = true;
    api('GET', '/api/version').then(function (j) {
      var syncChanged = JSON.stringify(j.sync) !== JSON.stringify(S.sync);
      S.sync = j.sync;
      if (j.version !== S.version || force) {
        var ae = document.activeElement;
        var typing = ae && (ae.tagName === 'TEXTAREA' || (ae.tagName === 'INPUT' && ae.type !== 'checkbox' && ae.type !== 'radio'));
        if (typing && ae.id !== 'q') return; // don't disturb typing; next tick will refresh
        return bootstrap().then(render);
      }
      if (syncChanged) { var ae2 = document.activeElement; if (!(ae2 && (ae2.tagName === 'TEXTAREA' || ae2.tagName === 'INPUT'))) render(); }
    }).catch(function () { /* offline; retry next tick */ }).finally(function () { refreshing = false; });
  }
  setInterval(function () { if (!document.hidden) refreshVersion(); }, 30000);
  document.addEventListener('visibilitychange', function () { if (!document.hidden) refreshVersion(); });

  // ------------------------------------------------------------------ start
  function start() {
    if (INIT.f && !S.fUsed) { S.fUsed = true; location.hash = '#/f/' + INIT.f; }
    var r = parseRoute();
    if (r === 'invite') { r = 'add'; location.hash = '#/add'; }
    if (!getName()) { S.phase = 'login'; render(); return; }
    S.route = r;
    openAppNow();
  }
  start();
})();

</script>
</body>
</html>
